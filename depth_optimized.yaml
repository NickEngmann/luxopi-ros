/oak:
  ros__parameters:
    camera:
      i_nn_type: none
      i_pipeline_type: RGBD  # Using RGBD since we're using pointcloud.launch.py
    
    # Stereo depth settings with all optimizations enabled
    stereo:
      i_publish_topic: true
      i_board_socket_id: 2
      i_subpixel: true
      i_lr_check: true
      i_extended_disp: true      # Better for depth range
      i_decimation_factor: 2     # Recommended for performance
      i_enable_spatial_filter: true
      i_enable_temporal_filter: true
      i_depth_preset: HIGH_ACCURACY
      i_stereo_conf_threshold: 200
      i_bilateral_sigma: 0      # Disable deprecated filter
      i_align_depth: true
      i_right_rect_publish_topic: true
      i_output_disparity: false

    # IR emitters for better passive stereo
    camera:
      i_enable_ir: true
      i_laser_dot_brightness: 1200
      i_floodlight_brightness: 1500

    # Lower the RGB resolution since we're primarily interested in depth
    rgb:
      i_resolution: '720p'
      i_fps: 15.0
      i_low_bandwidth: true      # Enable lower bandwidth for better performance
      i_publish_topic: true      # We need this for alignment
