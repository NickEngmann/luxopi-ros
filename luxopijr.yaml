/oak:
  ros__parameters:
    camera:
      i_nn_type: none
      i_pipeline_type: Stereo  # Changed from RGBD to Stereo to focus on depth only
    stereo:
      i_publish_topic: true
      i_board_socket_id: 2
      i_subpixel: true
      i_lr_check: true
      i_align_depth: false  # Since we're not aligning with RGB
      i_extended_disp: true  # Better for IR stereo
      i_enable_spatial_filter: true
      i_enable_temporal_filter: true
      i_decimation_factor: 2  # Enable decimation as recommended
      i_depth_preset: HIGH_DENSITY  # Better for IR-based depth
      i_stereo_conf_threshold: 180  # Slightly lower threshold for IR
      i_bilateral_sigma: 0  # Disable deprecated bilateral filter
      i_left_rect_publish_topic: true
      i_right_rect_publish_topic: true
      i_fps: 15.0  # Lower frame rate
    left:
      i_publish_topic: true
    right:  
      i_publish_topic: true
